<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse - Virtual Keyboard</title>
    <link rel="icon" href="/static/icons/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/mouse.css?v=0.1">
</head>

<body>
    <header>
        <div class="control-board">
            <div class="control-buttons">
                <div class="control-board-title">
                    <h1>Mouse</h1>
                    <p>Virtual Keyboard &bullet; v1.0.0</p>
                </div>

                <div class="control-button" data-toggle-page="keyboard">
                    <i class="material-symbols-outlined">keyboard_alt</i>
                </div>

                <div class="control-button" data-call-func="switchFullScreen">
                    <i class="material-symbols-outlined">fullscreen</i>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="mouse-buttons">
            <button type="left"></button>
            <div class="dpi" tabindex="8">
                <div>
                    <h2>8</h2>
                    <p>DPI</p>
                </div>
            </div>
            <button type="right"></button>
        </div>
        <div class="mouse-pad">
            <div id="cursorContainer">
                <div id="cursor"></div>
            </div>
        </div>
    </main>
    <script type="text/javascript" src="/static/js/mouse.js?v=0.1" defer></script>
</body>

</html>
